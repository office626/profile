name: ブランドサイトを検証・公開
on:
  push:
    branches: [main]
    paths: ['profile.yaml', 'portfolio.yaml', 'brand/**', '.github/workflows/build.yml']
  pull_request:
    paths: ['profile.yaml', 'portfolio.yaml', 'brand/**', '.github/workflows/build.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portfolio-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: brand/package-lock.json
      - name: Install
        run: npm ci
        working-directory: brand
      - name: Import public source data
        run: node scripts/import-profile.mjs ..
        working-directory: brand
      - name: Validate collector and types
        run: |
          npm test
          npx tsc --noEmit
        working-directory: brand
      - name: Build all pages and validate internal links
        run: npm run build:pages
        working-directory: brand
        env:
          NEXT_PUBLIC_BASE_PATH: /profile
          SITE_ORIGIN: https://office626.github.io
      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-static-site
          path: brand/dist/client
          include-hidden-files: true
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: brand/dist/client
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
