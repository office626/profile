# profile.yaml を編集して保存するだけで、README とサイトを自動で作り直す。
# スマホやブラウザから GitHub 上で直接編集した場合も動く。
name: プロフィールを再生成

on:
  push:
    branches: [main]
    paths:
      - "profile.yaml"
      - "portfolio.yaml"
      - "scripts/build.py"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pyyaml

      - name: 生成
        run: python3 scripts/build.py

      - name: 非公開情報が混ざっていないか確認
        run: |
          python3 - <<'PY'
          import pathlib, re, sys, yaml
          priv = [c["value"] for c in yaml.safe_load(open("profile.yaml", encoding="utf-8")).get("contacts", []) if not c.get("public")]
          targets = list(pathlib.Path(".").glob("README.md")) + list(pathlib.Path("docs").rglob("*")) + list(pathlib.Path("out").rglob("*"))
          fail = 0
          for p in targets:
              if not p.is_file():
                  continue
              text = p.read_text(encoding="utf-8", errors="ignore")
              text = re.sub(r"https://formsubmit\.co/[^\"'\s>]+", "", text)
              for v in priv:
                  if v and v in text:
                      print(f"::error::非公開の情報が生成物に含まれています: {v} ({p})")
                      fail = 1
          sys.exit(fail)
          PY

      - name: 変更があればコミット
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs out
          git diff --cached --quiet || git commit -m "自動生成: profile.yaml の変更を反映"
          git push
