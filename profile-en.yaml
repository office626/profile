  offerings:
    - title: "Local government planning and policy development"
      body: "Support for comprehensive plans, industrial promotion plans, and DX promotion plans; advisory committees; and design and facilitation of in-house workshops. Experience drafting plans on the national policy side helps bridge upper-level plans and grant requirements with what communities actually want to do."
      proof: "Science, Technology and Innovation Basic Plan at the Cabinet Office / Comprehensive Plan Review Committee, Minamiizu Town / Advisor to Kobe and Kusatsu cities"
    - title: "SME business improvement and financial planning with follow-through"
      body: "From financial statement analysis to bank-ready improvement plans, cash-flow forecasts, and numerical plans—with ongoing monitoring. As a certified support organization, documents meet formal requirements."
      proof: "SME Management Consultant / Certified Management Innovation Support Organization / SME Advisor, Organization for SME and Regional Innovation / Credit Guarantee Corporation expert registration"
    - title: "On-site productivity improvement and business reform"
      body: "From time studies (cycle time, lead time, uptime/downtime) to improvement planning through the 5M+1E lens. Applies large-enterprise experience in shared services and approval systems at SME scale."
      proof: "Productivity Improvement Support Center Supporter, Fukushima Yorozu Support Base / NEC corporate transformation"
    - title: "AI and ICT adoption—from concept to working tools"
      body: "Goes beyond “what can AI do?” seminars to building things that actually work in operations: generative AI use cases, internal rules, and small in-house tool prototypes."
      proof: "JDLA Deep Learning for GENERAL / Vibe Coder Bootcamp / Financial and Accounting DX Advisor, MIC"
    - title: "Training, lectures, and workshop design and delivery"
      body: "Programs for business advisors, government staff, and executives—designed with exercises and deliverables, not lectures alone. Also moderates panels and plans and runs events end to end."
      proof: "FM Aizu personality / training and workshop design / Digital Agency Well-being Indicators Facilitator"
    - title: "Regional diagnosis and area-based support for industrial districts and shopping streets"
      body: "Diagnosis at the area level, not company by company: reading statistics, mapping regional economic circulation, identifying key people, and linking usable national policies into one report."
      proof: "Regional diagnosis and area support in Minamiizu Town since 2018 / Board Member, NPO SME and Regional Revitalization Network"
    - title: "Co-creation and pilot coordination between large companies and local governments"
      body: "Bridges companies that want to work with municipalities and municipalities that want corporate partners, accounting for differences in how each side decides. Can also design consortium-style platforms."
      proof: "Founded Smart City Social Implementation Consortium (~300 organizations) / Chiba Prefecture DX Promotion Council, Citizen Co-creation Promotion Committee"
    - title: "Corporate functions and group management design for growing companies"
      body: "Meeting structures, approval rules, governance including subsidiaries, and articulating and embedding vision and values—scaled down to what works at each company’s size, not copied from big-company playbooks."
      proof: "NEC corporate planning: group management (~400 companies), company-wide councils, approval system, vision and values"

