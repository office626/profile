# ポートフォリオ — 匿名化した実績事例
# 顧客名・組織の立場は一般化して記載しています。

meta:
  updated: "2026-08-29"
  title: "実績・ポートフォリオ"
  intro: |
    守秘義務のある案件は、業種・規模・期間・関与内容・成果の5点に整理して掲載しています。
    詳細な事例や公開資料へのリンクは、個別のご相談でもお伝えできます。

cases:
  - id: policy-guidebook
    category: 国・政策
    title: スマートシティ関連の国の公表ガイド策定
    client: 中央省庁（政策立案部門）
    role: 企画・起草チームのコアメンバー
    period: "2019–2021年"
    scope: 全国自治体向けガイドブックと参照アーキテクチャの検討・文案作成、関連府省庁との調整
    result: 公表物として全国の自治体・事業者が参照できる形で整備。政策と現場実装の橋渡し資料として継続利用
    public_links:
      - label: デジタル庁 スマートシティ関連資料
        url: "https://www.digital.go.jp/policies/smartcity"

  - id: municipal-plan
    category: 自治体
    title: 総合計画・地域診断の継続支援
    client: 地方自治体（観光・農業が基幹の町、人口1万人台）
    role: 総合計画審議委員／地域診断アドバイザー
    period: "2018年〜継続"
    scope: 地域診断、産業振興計画の検討、地域事業者への面的支援、庁内ワークショップの設計・進行
    result: 計画策定プロセスを住民・事業者と共有し、複数年にわたる面的支援の土台を整備

  - id: sme-productivity
    category: 中小企業
    title: 製造業の生産性向上と経営数値の可視化
    client: 従業員20名規模の食品製造業
    role: 生産性向上支援・経営改善アドバイザー
    period: "6か月"
    scope: 現場の時間観測、ボトルネック特定、改善計画と月次モニタリングの設計
    result: リードタイムの短縮と稼働の見える化を実現。金融機関提出用の数値計画と接続

  - id: consortium
    category: 大企業・自治体
    title: 業界横断コンソーシアムの立ち上げと運営
    client: 企業・自治体・大学・NPOなど多様なステークホルダー
    role: 事務局代表／運営責任者
    period: "2022–2025年"
    scope: 参画団体の募集、運営規程・会議体の設計、共創案件のマッチング、公開イベントの企画
    result: のべ約300団体の参画を得て、複数の実証・共創の場を継続運営

  - id: npo-community
    category: NPO・地域活動
    title: 住民主体の自治会活動改善（自治ラボ）
    client: 首都圏の市と地域住民団体
    role: ファシリテーター／企画運営
    period: "2023年〜"
    scope: 住民ワークショップの設計、活動の見える化、デジタル活用の試行
    result: 参加しやすい場づくりと活動記録の仕組みを整備。継続的な改善サイクルを開始

  - id: dx-training
    category: 研修・講演
    title: 自治体職員向けDX・AI活用研修
    client: 地方自治体・支援機関
    role: 講師・ワークショップ設計
    period: "複数回（90分〜半日）"
    scope: 生成AIの業務適用、社内ルール整備、演習による業務フロー改善
    result: 受講者がその場で持ち帰れる成果物（業務メモ・チェックリスト）まで設計
