# ------------------------------------------------------------
# 依頼できること（＝発注者から見たメニュー）
# ------------------------------------------------------------
offerings:
  - title: "自治体の計画づくりと政策立案の伴走"
    layers: [jichi, kuni]
    body: "総合計画・産業振興計画・DX推進計画の策定支援、審議会・有識者委員、庁内ワークショップの設計と進行。国の政策側で計画を書いた経験があるため、上位計画や交付金の要件と現場のやりたいことの間を、無理なく接続する形で書き分けられます。"
    proof: "内閣府での科学技術・イノベーション基本計画策定／静岡県南伊豆町 総合計画審議委員／神戸市・草津市アドバイザー"
  - title: "中小企業の経営改善計画・数値計画の策定と実行支援"
    layers: [chusho]
    body: "決算書の分析から、金融機関に出せる経営改善計画・資金繰り表・数値計画までを作り、その後のモニタリングまで伴走します。認定経営革新等支援機関として、制度上の要件を満たす形で作成できます。"
    proof: "中小企業診断士／経営革新等認定支援機関／中小機構 中小企業アドバイザー／信用保証協会 専門家登録"
  - title: "生産性向上・業務改革の現場支援"
    layers: [chusho, daikigyo]
    body: "時間観測（サイクルタイム・リードタイム・稼働／非稼働）に基づく現場の可視化から、5M＋1Eの視点での改善計画づくりまで。大企業で間接部門のシェアードサービス化と全社稟議システム導入を実行した経験を、中小企業の規模に合わせて置き換えます。"
    proof: "福島県よろず支援拠点 生産性向上支援センター サポーター／NEC コーポレート変革"
  - title: "AI・ICT活用の導入支援（構想から実物まで）"
    layers: [chusho, jichi]
    body: "「AIで何ができるか」の勉強会で終わらせず、実際に業務で動くものを一緒に作るところまで。生成AIの業務適用、社内ルールの整備、小さな内製ツールの試作を行います。"
    proof: "JDLA Deep Learning for GENERAL 合格／Vibe Coder Bootcamp 修了／総務省 財務・会計DXアドバイザー"
  - title: "研修・講演・ワークショップの設計と登壇"
    layers: [jinzai]
    body: "経営指導員・自治体職員・経営者向けの研修を、講義だけで終わらせず演習と成果物まで含めて設計します。司会進行、パネルのモデレート、イベント全体の企画運営も引き受けます。"
    proof: "エフエム会津 パーソナリティ／各種研修・ワークショップの企画運営／デジタル庁 well-being指標活用ファシリテーター"
  - title: "地域診断・産地／商店街の面的支援"
    layers: [jichi, chusho]
    body: "個社ではなく「面」で地域を見る診断。統計データの読み解き、地域経済循環の構造整理、キーパーソンの洗い出し、使える国の政策の紐づけまでを一つのレポートにまとめます。"
    proof: "静岡県南伊豆町での地域診断事業と面的支援（2018年〜）／NPO法人 中小企業・地域創生ネットワーク 理事"
  - title: "大企業と自治体をつなぐ共創・実証のコーディネート"
    layers: [daikigyo, jichi, kuni]
    body: "自治体と組みたい企業、企業と組みたい自治体の間に立ち、双方の意思決定の作法の違いを踏まえて話をまとめます。コンソーシアム型の場づくりそのものの設計もできます。"
    proof: "スマートシティ社会実装コンソーシアム設立（のべ約300団体）／千葉県DX推進協議会 市民共創推進部会 運営"
  - title: "成長企業のコーポレート機能・グループ経営の設計"
    layers: [daikigyo, chusho]
    body: "人が増えて管理が回らなくなった会社の、会議体の設計、決裁ルール、子会社を含めたガバナンス、理念やバリューの言語化と浸透。大企業の型をそのまま持ち込むのではなく、その規模で機能する最小構成に落とします。"
    proof: "NEC 経営企画部門でのグループ経営（約400社）、全社会議体運営、稟議システム導入、ビジョン・バリュー策定"

