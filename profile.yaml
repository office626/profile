  - "研修・ワークショップの企画運営、イベント司会進行、ファシリテーション"
  - "ICT／AI活用による業務改革支援と実践"
  - "NPO・地域コミュニティの合意形成と活動設計"

offerings:
  - title: "自治体の計画づくりと政策立案の伴走"
    layers: [jichi, kuni]
    body: "総合計画・産業振興計画・DX推進計画の策定支援、審議会・有識者委員、庁内ワークショップの設計と進行。国の政策側で計画を書いた経験を活かし、上位計画や交付金の要件と現場のやりたいことを無理なく接続します。オンライン参加可。契約形態は委員報酬・謝金・業務委託など、実績のある形態に対応します。"
    proof: "内閣府での科学技術・イノベーション基本計画策定／総合計画審議委員・自治体アドバイザー多数"
  - title: "中小企業の経営改善計画・数値計画の策定と実行支援"
    layers: [chusho]
    body: "決算書の分析から、金融機関に提出できる経営改善計画・資金繰り表・数値計画までを作成し、月次モニタリングまで伴走します。製造・卸売・サービスなど従業員5〜50名規模の支援実績があります。標準的には月1回訪問・6か月程度の伴走です。"
    proof: "中小企業診断士／経営革新等認定支援機関／よろず支援拠点サポーター"
  - title: "生産性向上・業務改革の現場支援"
    layers: [chusho, daikigyo]
    body: "時間観測に基づく現場の可視化から、改善計画づくりまで。大企業で実行した間接部門改革・稟議システム導入の経験を、中小企業の規模に合わせて置き換えます。"
    proof: "福島県よろず支援拠点 生産性向上支援センター サポーター／NEC コーポレート変革"
  - title: "AI・ICT活用の導入支援（構想から実物まで）"
    layers: [chusho, jichi]
    body: "勉強会で終わらせず、業務で動くものを一緒に作るところまで。生成AIの業務適用、社内ルール整備、小さな内製ツールの試作に対応します。"
    proof: "JDLA Deep Learning for GENERAL 合格／総務省 財務・会計DXアドバイザー"
  - title: "研修・講演・ワークショップの設計と登壇"
    layers: [jinzai]
    body: "経営指導員・自治体職員・経営者向けに、演習と持ち帰り成果物まで含めて設計。司会進行、パネルモデレート、イベント全体の企画運営も承ります。"
    proof: "エフエム会津 パーソナリティ／デジタル庁 well-being指標活用ファシリテーター"
  - title: "地域診断・産地／商店街の面的支援"
    layers: [jichi, chusho]
    body: "統計の読み解き、地域経済循環の整理、キーパーソン洗い出し、使える国の政策との接続までを一つのレポートにまとめます。"
    proof: "地域診断・面的支援（2018年〜）／NPO 中小企業・地域創生ネットワーク 理事"
  - title: "大企業と自治体をつなぐ共創・実証のコーディネート"
    layers: [daikigyo, jichi, kuni]
    body: "双方の意思決定の作法の違いを踏まえて話をまとめます。予算サイクルや稟議の実務感覚も共有できます。守秘契約の締結に対応します。"
    proof: "スマートシティ社会実装コンソーシアム（のべ約300団体）／千葉県DX推進協議会"
  - title: "成長企業のコーポレート機能・グループ経営の設計"
    layers: [daikigyo, chusho]
    body: "会議体・決裁ルール・ガバナンス、理念の言語化と浸透。大企業の型をそのまま持ち込まず、規模に合った最小構成に落とします。"
    proof: "NEC 経営企画部門でのグループ経営（約400社）"

npo_offering:
  title: "NPO・地域活動向けの支援"
  body: |
    地域のNPO、市民団体、自治会活動向けに、無償または減額の相談枠を設けています。
    助成金の整理、会計・組織運営の見直し、住民の合意形成の場づくり、デジタル活用の試行などに対応します。
    まずはお気軽にご相談ください。

